[project]
name = "tile2net"
version = "0.5.0"
description = "Pedestrian networks from aerial imagery tiles"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "urban-analytics",
    "pedestrian-network",
    "create-annotation",
    "sidewalk-detection"
]
authors = [
    { name = "Maryam Hosseini", email = "maryamh@berkeley.edu" },
]
maintainers = [
    { name = "Daniel Hodczak", email = "dhodcz2@uic.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "affine",
    "argh==0.29.4",
    "centerline",
    "certifi",
    "geopandas>=1.0",
    "geopy",
    "imageio",
    "matplotlib",
    "more-itertools",
    "numpy>=1.26,<3",
    "opencv-python",
    "osmnx",
    "pandas",
    "pillow",
    "psutil",
    "pyarrow",
    "pyogrio",
    "pyproj",
    "rasterio",
    "requests>=2.32,<3",
    "scikit-image",
    "scipy",
    "shapely>=2.0.7,<3",
    "tabulate",
    "toolz",
    "torch",
    "torchvision",
    "tqdm",
    "urllib3",
]

[project.optional-dependencies]
test = ["pytest"]
notebooks = ["jupyter"]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-rtd-theme",
    "nbsphinx",
    "pandoc",
    "sphinx-autobuild",
    "sphinx-copybutton",
]

[project.urls]
repository = "https://github.com/VIDA-NYU/tile2net"
documentation = "https://tile2net.readthedocs.io/en/latest/?badge=latest"
issue-tracker = "https://github.com/VIDA-NYU/tile2net/issues"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools >= 77",
    "wheel",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["tile2net*"]
exclude = ["tile2net.tileseg.tests*"]

[tool.setuptools.package-data]
"tile2net.artifacts.sample.brk_sw_lines" = ["*"]
"tile2net" = ["logging.conf"]
"tile2net.raster" = ["nominatim.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.npy", "**/*.npy"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "-m", "not integration"]
markers = [
    "gpu: end-to-end tests requiring a CUDA device and model inference",
    "integration: local end-to-end tests that run segmentation inference",
    "remote: tests that require network access or remote inference",
]
