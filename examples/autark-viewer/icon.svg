<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Tile2Net Visualizer</title>
  <desc>Pixel mosaic of a pair of crossings and park paths along Charles Street in Boston.</desc>
  <defs>
    <rect id="frame" width="64" height="64" rx="13"/>
    <rect id="pixel" x="0.07" y="0.07" width="0.86" height="0.86" rx="0.10"/>
    <clipPath id="crop"><use href="#frame"/></clipPath>
  </defs>
  <use href="#frame" fill="#203532"/>
  <g clip-path="url(#crop)">
    <g transform="scale(3.2)">
      <!-- Charles Street -->
      <g fill="#739c7d">
        <use href="#pixel" x="5" y="0"/> <use href="#pixel" x="6" y="0"/> <use href="#pixel" x="7" y="0"/> <use href="#pixel" x="8" y="0"/>
        <use href="#pixel" x="5" y="1"/> <use href="#pixel" x="6" y="1"/> <use href="#pixel" x="7" y="1"/> <use href="#pixel" x="8" y="1"/>
        <use href="#pixel" x="6" y="2"/> <use href="#pixel" x="7" y="2"/> <use href="#pixel" x="8" y="2"/> <use href="#pixel" x="9" y="2"/>
        <use href="#pixel" x="6" y="3"/> <use href="#pixel" x="7" y="3"/> <use href="#pixel" x="8" y="3"/> <use href="#pixel" x="9" y="3"/>
        <use href="#pixel" x="6" y="4"/> <use href="#pixel" x="7" y="4"/> <use href="#pixel" x="8" y="4"/> <use href="#pixel" x="9" y="4"/>
        <use href="#pixel" x="7" y="5"/> <use href="#pixel" x="8" y="5"/> <use href="#pixel" x="9" y="5"/> <use href="#pixel" x="10" y="5"/>
        <use href="#pixel" x="7" y="6"/> <use href="#pixel" x="8" y="6"/> <use href="#pixel" x="9" y="6"/> <use href="#pixel" x="10" y="6"/>
        <use href="#pixel" x="7" y="7"/> <use href="#pixel" x="8" y="7"/> <use href="#pixel" x="9" y="7"/> <use href="#pixel" x="10" y="7"/>
        <use href="#pixel" x="11" y="8"/>
        <use href="#pixel" x="8" y="9"/> <use href="#pixel" x="9" y="9"/> <use href="#pixel" x="10" y="9"/> <use href="#pixel" x="11" y="9"/>
        <use href="#pixel" x="8" y="10"/> <use href="#pixel" x="9" y="10"/> <use href="#pixel" x="10" y="10"/> <use href="#pixel" x="11" y="10"/>
        <use href="#pixel" x="12" y="11"/>
        <use href="#pixel" x="9" y="12"/> <use href="#pixel" x="10" y="12"/> <use href="#pixel" x="11" y="12"/> <use href="#pixel" x="12" y="12"/>
        <use href="#pixel" x="9" y="13"/> <use href="#pixel" x="10" y="13"/> <use href="#pixel" x="11" y="13"/> <use href="#pixel" x="12" y="13"/>
        <use href="#pixel" x="10" y="14"/> <use href="#pixel" x="11" y="14"/> <use href="#pixel" x="12" y="14"/> <use href="#pixel" x="13" y="14"/>
        <use href="#pixel" x="10" y="15"/> <use href="#pixel" x="11" y="15"/> <use href="#pixel" x="12" y="15"/> <use href="#pixel" x="13" y="15"/>
        <use href="#pixel" x="10" y="16"/> <use href="#pixel" x="11" y="16"/> <use href="#pixel" x="12" y="16"/> <use href="#pixel" x="13" y="16"/>
        <use href="#pixel" x="11" y="17"/> <use href="#pixel" x="12" y="17"/> <use href="#pixel" x="13" y="17"/> <use href="#pixel" x="14" y="17"/>
        <use href="#pixel" x="11" y="18"/> <use href="#pixel" x="12" y="18"/> <use href="#pixel" x="13" y="18"/> <use href="#pixel" x="14" y="18"/>
        <use href="#pixel" x="11" y="19"/> <use href="#pixel" x="12" y="19"/> <use href="#pixel" x="13" y="19"/> <use href="#pixel" x="14" y="19"/>
      </g>
      <!-- Sidewalks and park paths -->
