        <use href="#pixel" x="17" y="8"/>
        <use href="#pixel" x="4" y="9"/> <use href="#pixel" x="5" y="9"/> <use href="#pixel" x="12" y="9"/> <use href="#pixel" x="15" y="9"/> <use href="#pixel" x="18" y="9"/>
        <use href="#pixel" x="19" y="9"/>
        <use href="#pixel" x="5" y="10"/> <use href="#pixel" x="6" y="10"/> <use href="#pixel" x="7" y="10"/> <use href="#pixel" x="15" y="10"/>
        <use href="#pixel" x="5" y="11"/> <use href="#pixel" x="8" y="11"/> <use href="#pixel" x="13" y="11"/> <use href="#pixel" x="16" y="11"/>
        <use href="#pixel" x="4" y="12"/> <use href="#pixel" x="5" y="12"/> <use href="#pixel" x="6" y="12"/> <use href="#pixel" x="13" y="12"/> <use href="#pixel" x="16" y="12"/>
        <use href="#pixel" x="1" y="13"/> <use href="#pixel" x="2" y="13"/> <use href="#pixel" x="3" y="13"/> <use href="#pixel" x="5" y="13"/> <use href="#pixel" x="7" y="13"/>
        <use href="#pixel" x="8" y="13"/> <use href="#pixel" x="13" y="13"/> <use href="#pixel" x="16" y="13"/>
        <use href="#pixel" x="0" y="14"/> <use href="#pixel" x="4" y="14"/> <use href="#pixel" x="5" y="14"/> <use href="#pixel" x="7" y="14"/> <use href="#pixel" x="9" y="14"/>
        <use href="#pixel" x="14" y="14"/> <use href="#pixel" x="16" y="14"/>
        <use href="#pixel" x="4" y="15"/> <use href="#pixel" x="5" y="15"/> <use href="#pixel" x="6" y="15"/> <use href="#pixel" x="7" y="15"/> <use href="#pixel" x="9" y="15"/>
        <use href="#pixel" x="14" y="15"/> <use href="#pixel" x="16" y="15"/>
        <use href="#pixel" x="3" y="16"/> <use href="#pixel" x="7" y="16"/> <use href="#pixel" x="9" y="16"/> <use href="#pixel" x="14" y="16"/> <use href="#pixel" x="15" y="16"/>
        <use href="#pixel" x="2" y="17"/> <use href="#pixel" x="7" y="17"/> <use href="#pixel" x="10" y="17"/> <use href="#pixel" x="15" y="17"/>
        <use href="#pixel" x="2" y="18"/> <use href="#pixel" x="7" y="18"/> <use href="#pixel" x="10" y="18"/> <use href="#pixel" x="15" y="18"/> <use href="#pixel" x="16" y="18"/>
        <use href="#pixel" x="2" y="19"/> <use href="#pixel" x="7" y="19"/> <use href="#pixel" x="10" y="19"/> <use href="#pixel" x="15" y="19"/> <use href="#pixel" x="16" y="19"/>
      </g>
      <!-- Paired crossings -->
      <g fill="#f7c581">
        <use href="#pixel" x="11" y="7"/>
        <use href="#pixel" x="8" y="8"/> <use href="#pixel" x="9" y="8"/> <use href="#pixel" x="10" y="8"/>
        <use href="#pixel" x="12" y="10"/>
        <use href="#pixel" x="9" y="11"/> <use href="#pixel" x="10" y="11"/> <use href="#pixel" x="11" y="11"/>
      </g>
      <!-- Sidewalk connectors -->
      <g fill="#cf8654">
        <use href="#pixel" x="12" y="7"/>
        <use href="#pixel" x="7" y="9"/>
        <use href="#pixel" x="13" y="10"/>
        <use href="#pixel" x="8" y="12"/>
      </g>
    </g>
  </g>
</svg>
