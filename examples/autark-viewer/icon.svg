        <use href="#pixel" x="4" y="1"/> <use href="#pixel" x="9" y="1"/>
        <use href="#pixel" x="5" y="2"/> <use href="#pixel" x="10" y="2"/>
        <use href="#pixel" x="5" y="3"/> <use href="#pixel" x="10" y="3"/>
        <use href="#pixel" x="0" y="4"/> <use href="#pixel" x="5" y="4"/> <use href="#pixel" x="10" y="4"/> <use href="#pixel" x="18" y="4"/> <use href="#pixel" x="19" y="4"/>
        <use href="#pixel" x="1" y="5"/> <use href="#pixel" x="2" y="5"/> <use href="#pixel" x="6" y="5"/> <use href="#pixel" x="11" y="5"/> <use href="#pixel" x="17" y="5"/>
        <use href="#pixel" x="3" y="6"/> <use href="#pixel" x="6" y="6"/> <use href="#pixel" x="11" y="6"/> <use href="#pixel" x="17" y="6"/>
        <use href="#pixel" x="3" y="7"/> <use href="#pixel" x="6" y="7"/> <use href="#pixel" x="15" y="7"/> <use href="#pixel" x="16" y="7"/>
